<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>후후티비</title>
    <style>
        /* 기존 반응형 CSS 동일 적용 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }
        html, body { width: 100%; height: 100%; background-color: #06070d; font-family: 'SamsungOne', 'Segoe UI', 'Roboto', sans-serif; color: #ffffff; }
        #app_container { position: relative; width: 100%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at 50% 30%, #101226 0%, #05060b 100%); padding: 20px; overflow: hidden; }
        .ambient_glow { position: absolute; width: 50vw; height: 50vw; max-width: 700px; max-height: 700px; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.18; z-index: 0; }
        .glow_left { top: -10%; left: -10%; background: #2563eb; }
        .glow_right { bottom: -10%; right: -10%; background: #7c3aed; }
        #splash_card { width: 100%; max-width: 1080px; background: rgba(18, 20, 36, 0.8); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px; padding: 40px; backdrop-filter: blur(24px); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; gap: 24px; z-index: 10; }
        .brand_header { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 16px; }
        .brand_icon { font-size: 32px; }
        .brand_title { font-size: 28px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; }
        .status_box { display: flex; align-items: center; gap: 16px; background: rgba(11, 13, 23, 0.6); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 18px; padding: 16px 20px; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(56, 189, 248, 0.2); border-top: 3px solid #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status_content { display: flex; flex-direction: column; gap: 4px; }
        .status_title { font-size: 18px; font-weight: 700; color: #38bdf8; }
        .status_desc { font-size: 14px; color: #94a3b8; word-break: keep-all; }
        .target_url_display { display: flex; flex-direction: column; gap: 6px; background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 16px 20px; }
        .url_label { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .url_text { font-size: 20px; font-weight: 800; color: #f1f5f9; letter-spacing: 0.5px; word-break: break-all; }
        .countdown_container { display: flex; flex-direction: column; gap: 10px; }
        .countdown_gauge { width: 100%; height: 5px; background: #38bdf8; border-radius: 3px; box-shadow: 0 0 12px rgba(56, 189, 248, 0.6); transition: width 1s linear; }
        .countdown_msg { font-size: 13px; color: #cbd5e1; word-break: keep-all; }
        .nav_actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
        .btn_action { display: flex; align-items: center; justify-content: center; flex: 1 1 auto; gap: 8px; padding: 14px 20px; border-radius: 14px; border: 2px solid transparent; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700; transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1); min-width: 150px; }
        .btn_action .icon { font-size: 18px; }
        .btn_primary { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4); }
        .btn_primary:focus, .btn_primary:hover, .btn_primary.focused { background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); border-color: #ffffff; box-shadow: 0 0 28px rgba(56, 189, 248, 0.8); transform: scale(1.03); }
        .btn_secondary { background: #1e293b; color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.15); }
        .btn_secondary:focus, .btn_secondary:hover, .btn_secondary.focused { background: #334155; border-color: #38bdf8; color: #38bdf8; transform: scale(1.03); }
        .btn_tertiary { background: #1e1b4b; color: #c7d2fe; border: 1px solid rgba(199, 210, 254, 0.2); }
        .btn_tertiary:focus, .btn_tertiary:hover, .btn_tertiary.focused { background: #312e81; border-color: #818cf8; color: #ffffff; transform: scale(1.03); }
        @media screen and (max-width: 600px) { #splash_card { padding: 24px; } .nav_actions { flex-direction: column; } .btn_action { width: 100%; } }
    </style>
</head>
<body>
    <div id="app_container">
        <div class="ambient_glow glow_left"></div>
        <div class="ambient_glow glow_right"></div>

        <main id="splash_card">
            <div class="brand_header">
                <span class="brand_icon">📺</span>
                <h1 class="brand_title">후후티비</h1>
            </div>

            <div class="status_box">
                <div class="spinner" id="main_spinner"></div>
                <div class="status_content">
                    <div class="status_title" id="status_title">텔레그래프 API 최신 주소 조회 중...</div>
                    <div class="status_desc" id="status_desc">최신 주소로 연결을 시도합니다.</div>
                </div>
            </div>

            <div class="target_url_display">
                <span class="url_label">연결 대상 주소</span>
                <span class="url_text" id="target_url_text">조회 중...</span>
            </div>

            <div class="countdown_container" id="countdown_box">
                <div class="countdown_gauge" id="countdown_gauge"></div>
                <p class="countdown_msg" id="countdown_msg">잠시 후 자동으로 접속합니다. (취소: 화면 터치 또는 클릭)</p>
            </div>

            <div class="nav_actions">
                <button id="btn_go_hoho" class="btn_action btn_primary" tabindex="1">
                    <span class="icon">⚡</span>
                    <span class="label">지금 바로 접속</span>
                </button>
                <button id="btn_go_wiki" class="btn_action btn_secondary" tabindex="2">
                    <span class="icon">📢</span>
                    <span class="label">공지 채널 접속</span>
                </button>
                <button id="btn_refresh" class="btn_action btn_tertiary" tabindex="3">
                    <span class="icon">↻</span>
                    <span class="label">주소 다시 조회</span>
                </button>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const statusTitle = document.getElementById("status_title");
            const targetUrlText = document.getElementById("target_url_text");
            const mainSpinner = document.getElementById("main_spinner");
            const countdownGauge = document.getElementById("countdown_gauge");
            const countdownMsg = document.getElementById("countdown_msg");
            
            let fetchedUrl = "";
            let countdownInterval;
            let timeRemaining = 5;
            let isCancelled = false;

            // Telegraph 본문에서 URL을 추출하는 재귀 함수 (JS 버전)
            function extractUrl(node) {
                if (typeof node === 'string') {
                    const match = node.match(/https?:\/\/[a-zA-Z0-9\-\.]+\.[a-zA-Z]{2,}(?:\/\S*)?/);
                    if (match) return match[0];
                } else if (Array.isArray(node)) {
                    for (let item of node) {
                        const res = extractUrl(item);
                        if (res) return res;
                    }
                } else if (typeof node === 'object' && node !== null) {
                    if (node.tag === 'a' && node.attrs && node.attrs.href) return node.attrs.href;
                    if (node.children) {
                        const res = extractUrl(node.children);
                        if (res) return res;
                    }
                }
                return null;
            }

            // Telegraph API 호출
            const title = encodeURIComponent("후후티비-최신-주소-09-03");
            const apiUrl = `https://api.telegra.ph/getPage/${title}?return_content=true`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data && data.ok) {
                        fetchedUrl = extractUrl(data.result.content);
                        if (fetchedUrl) {
                            statusTitle.innerText = "최신 주소 조회 성공";
                            targetUrlText.innerText = fetchedUrl;
                            mainSpinner.style.display = "none";
                            startCountdown();
                        } else {
                            handleError("본문에서 주소를 찾을 수 없습니다.");
                        }
                    } else {
                        handleError("유효하지 않은 응답입니다.");
                    }
                })
                .catch(error => {
                    handleError("API 통신 오류가 발생했습니다.");
                });

            function startCountdown() {
                countdownInterval = setInterval(() => {
                    if (isCancelled) return;
                    timeRemaining -= 1;
                    countdownGauge.style.width = (timeRemaining / 5 * 100) + "%";
                    if (timeRemaining <= 0) {
                        clearInterval(countdownInterval);
                        window.location.href = fetchedUrl;
                    }
                }, 1000);
            }

            function handleError(msg) {
                statusTitle.innerText = "주소 조회 실패";
                statusTitle.style.color = "#ef4444";
                targetUrlText.innerText = msg;
                mainSpinner.style.display = "none";
                countdownGauge.style.width = "0%";
                countdownMsg.innerText = "자동 접속을 취소합니다.";
                isCancelled = true;
            }

            // 자동 접속 취소 이벤트
            function cancelAutoConnect() {
                if (!isCancelled && fetchedUrl) {
                    isCancelled = true;
                    clearInterval(countdownInterval);
                    countdownMsg.innerText = "자동 접속이 취소되었습니다.";
                    countdownGauge.style.width = "0%";
                }
            }

            document.addEventListener('keydown', cancelAutoConnect);
            document.addEventListener('click', cancelAutoConnect);
            document.addEventListener('touchstart', cancelAutoConnect);

            // 버튼 이벤트
            document.getElementById("btn_go_hoho").addEventListener("click", () => {
                if(fetchedUrl) window.location.href = fetchedUrl;
                else alert("접속할 주소가 아직 로드되지 않았거나 없습니다.");
            });

            document.getElementById("btn_go_wiki").addEventListener("click", () => {
                window.location.href = "https://telegra.ph/%ED%9B%84%ED%9B%84%ED%8B%B0%EB%B9%84-%EC%B5%9C%EC%8B%A0-%EC%A3%BC%EC%86%8C-09-03";
            });

            document.getElementById("btn_refresh").addEventListener("click", () => {
                window.location.reload();
            });
        });
    </script>
</body>
</html>
